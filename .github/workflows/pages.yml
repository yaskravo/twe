name: Deploy to GitHub Pages

# Builds Expert from master and publishes it on GitHub Pages (Settings → Pages → Source: GitHub
# Actions). The app is static: the browser connects to Telegram itself, nothing runs on a server.
#
# The site's own Telegram API id is taken from the repository secrets TELEGRAM_API_ID and
# TELEGRAM_API_HASH (my.telegram.org → API development tools) when they are set; without them the
# build keeps the one in .env.

on:
  push:
    branches: [master]
  workflow_dispatch:

# * the actions are pinned to commits, not tags: this build publishes the page people sign in on,
# * so nothing in it may change under it without a change to this file
permissions:
  contents: read
  pages: write
  id-token: write

# * one deployment at a time, and a newer push does not wait for an older one to finish
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Use the site's own Telegram API id
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            printf 'VITE_API_ID=%s\nVITE_API_HASH=%s\n' "$API_ID" "$API_HASH" > .env.local
          fi

      # * a client whose cached language pack is older than this number fetches it again, so the
      # * strings a deploy brings reach those who have the site open already
      - name: Number this build's local strings
        run: echo "const langPackLocalVersion = ${{ github.run_number }};export default langPackLocalVersion;" > src/langPackLocalVersion.ts

      # * `pnpm build` also runs every unit test, and one suite fails on the upstream code as well
      - run: pnpm run typecheck
      - run: pnpm run generate-changelog
      - run: pnpm exec vite build
      - run: pnpm run check-bundle

      # * the site is what server.js serves: the build over public/, which holds the static assets
      # * (images, fonts, sounds, the voice recorder's workers) the build does not copy
      - name: Put the site together
        run: |
          mkdir site
          cp -r public/. site/
          cp -r dist/. site/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
